name: Play Store Deploy

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - internal_draft
          - closed
          - open
          - production_draft
          - production_rollout_10
          - promote_internal_production_10

jobs:
  deploy:
    # Self-hosted runner on Contabo (label `contabo`). GitHub-hosted minutes are
    # billing-blocked; self-hosted minutes are free and bypass that. Secrets are
    # still injected by GitHub at run time and wiped by the final cleanup step.
    # Flip back to `ubuntu-latest` once hosted billing is restored.
    runs-on: [self-hosted, contabo]
    timeout-minutes: 40
    env:
      TRACK: ${{ github.event.inputs.track }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the known-good local toolchain. Latest stable enforces
          # JVM-target consistency and fails compiling flutter_facebook_auth
          # (Java 1.8 vs Kotlin 17). Unpin only after aligning plugin JVM
          # targets in Gradle.
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Set up Android SDK
        # GitHub-hosted images ship the Android SDK; the self-hosted Contabo
        # runner does not. Installs cmdline-tools + accepts licenses; Gradle
        # auto-downloads the platform/build-tools/NDK the build needs.
        uses: android-actions/setup-android@v3

      - name: Set up Ruby + bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dr-release.jks
          test -s android/app/dr-release.jks

      - name: Write key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEY_PROPERTIES" > android/key.properties
          test -s android/key.properties

      - name: Write Play Console service account JSON
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > android/play-console-key.json
          test -s android/play-console-key.json

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release AAB
        # Promote lanes move an existing Play release between tracks — nothing
        # to build or upload.
        if: ${{ !startsWith(github.event.inputs.track, 'promote_') }}
        run: flutter build appbundle --release

      - name: Export AAB artifact (for manual console upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draftright-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-file-found: warn

      - name: Upload to Play
        working-directory: android
        run: bundle exec fastlane "$TRACK"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/app/dr-release.jks
          rm -f android/key.properties
          rm -f android/play-console-key.json
