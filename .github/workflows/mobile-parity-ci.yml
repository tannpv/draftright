name: Mobile parity checks

# Guards the cross-language duplicated facts that RULE #1 can't merge into one
# source (Kotlin vs Swift). Runs on the self-hosted Contabo runner (free), not
# GitHub-hosted minutes.
on:
  push:
    branches: [develop, main]
    paths:
      - 'DraftRightMobile/android/app/src/main/res/raw/wordlist_vi_bigrams.tsv'
      - 'DraftRightMobile/ios/DraftRightKeyboardCore/Sources/DraftRightKeyboardCore/IME/VietnameseBootstrapWordList.swift'
      - 'scripts/check-vi-bigram-parity.py'
      - '.github/workflows/mobile-parity-ci.yml'
  pull_request:
    paths:
      - 'DraftRightMobile/android/app/src/main/res/raw/wordlist_vi_bigrams.tsv'
      - 'DraftRightMobile/ios/DraftRightKeyboardCore/Sources/DraftRightKeyboardCore/IME/VietnameseBootstrapWordList.swift'
      - 'scripts/check-vi-bigram-parity.py'

jobs:
  vi-bigram-parity:
    name: VI bigram parity (Android TSV ↔ iOS Swift)
    runs-on: [self-hosted, linux, x64, draftright]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert the two bigram copies agree
        run: python3 scripts/check-vi-bigram-parity.py
