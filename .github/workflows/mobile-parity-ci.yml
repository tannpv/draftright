name: Mobile parity checks

# Guards the cross-language duplicated facts that RULE #1 can't merge into one
# source (Kotlin vs Swift). Runs on the self-hosted Contabo runner (free), not
# GitHub-hosted minutes.
#
# SECURITY: push-only, NO pull_request trigger. The runner is self-hosted on a
# shared box; running a PR's checkout (which could modify the script it runs)
# on it would be arbitrary code execution on our infra. push to develop/main is
# maintainer-controlled, so the checked-out script is already-trusted code.
on:
  # Manual run only adds a maintainer-triggered dispatch (safe on the self-hosted
  # runner — no fork-PR code path); the security reason to avoid pull_request
  # does not apply to workflow_dispatch.
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'DraftRightMobile/android/app/src/main/res/raw/wordlist_vi_bigrams.tsv'
      - 'DraftRightMobile/ios/DraftRightKeyboardCore/Sources/DraftRightKeyboardCore/IME/VietnameseBootstrapWordList.swift'
      - 'DraftRightMobile/android/app/src/main/kotlin/com/draftright/keyboard/ime/PinyinSyllables.kt'
      - 'DraftRightMobile/ios/DraftRightKeyboardCore/Sources/DraftRightKeyboardCore/IME/PinyinSyllables.swift'
      - 'scripts/check-vi-bigram-parity.py'
      - 'scripts/check-pinyin-syllables-parity.py'
      - '.github/workflows/mobile-parity-ci.yml'

permissions:
  contents: read

jobs:
  vi-bigram-parity:
    name: VI bigram parity (Android TSV ↔ iOS Swift)
    runs-on: [self-hosted, linux, x64, draftright]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert the two bigram copies agree
        run: python3 scripts/check-vi-bigram-parity.py
      - name: Assert the two pinyin syllable sets agree
        run: python3 scripts/check-pinyin-syllables-parity.py
