name: Backend Go CI

# Gates every PR + push touching backend-rewrite-go/ — the Go backend is now
# THE backend (NestJS is being retired, see the Go-only migration epic), so it
# must be CI-gated in its own right rather than shadow-compared against Node.
#
# SECURITY:
# Every templated `${{ ... }}` expression references only GitHub-controlled
# context (github.workflow, github.ref, env.*). No commit message / PR title /
# branch name reaches a `run:` step. No injection vector.
# Reference: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend-rewrite-go/**'
      - '.github/workflows/backend-go-ci.yml'
  pull_request:
    paths:
      - 'backend-rewrite-go/**'
      - '.github/workflows/backend-go-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WORKDIR: backend-rewrite-go

jobs:
  build:
    name: go build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go version — read from go.mod, never
          # duplicated here (Rule #1).
          go-version-file: ${{ env.WORKDIR }}/go.mod
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum
      - run: go build ./...

  vet:
    name: go vet
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKDIR }}/go.mod
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum
      - run: go vet ./...

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKDIR }}/go.mod
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum
      - name: gofmt -l (must be empty)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"; echo "$unformatted"
            exit 1
          fi

  test:
    name: go test (race)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKDIR }}/go.mod
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum
      - run: go test ./... -race
