name: Build Windows app

on:
  push:
    branches: [develop, main]
    paths:
      - 'DraftRightWindows/**'
      - '.github/workflows/build-windows.yml'
    # Tag pushes (`git push origin v2.2.x`) auto-ship: pairs with the
    # publish-to-update-server condition below so a tag push alone is enough
    # to land a release on the update server — no GitHub Release object
    # required. Every release tag points at a merge commit that bumped the
    # .csproj, so the path filter is always satisfied.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Target runtime'
        required: false
        default: 'both'
        type: choice
        options: [both, win-x64, win-arm64]
  release:
    types: [created]

# Release-triggered runs attach artifacts to the GitHub release; without
# this the default GITHUB_TOKEN can't update release assets and the
# softprops/action-gh-release step fails with "Resource not accessible
# by integration", which cascades to fail the whole build job and skip
# the publish-to-update-server step.
permissions:
  contents: write

jobs:
  # Headless unit gate (issue #80). DraftRightWindows.Tests cannot run here: it
  # references the WinUI app assembly, whose CsWinRT/WinUI module initializer
  # bootstraps the WinRT runtime at load and hangs discovery on a headless
  # runner — "All tests finished running" with zero tests executed.
  #
  # DraftRightWindows.PureTests has no ProjectReference. It compiles the UI-free
  # source files directly and targets plain net8.0, so it runs on ubuntu-latest
  # in seconds. Keep it that way: adding a ProjectReference to the app project
  # reintroduces the hang.
  unit-tests:
    name: Unit tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run pure-logic unit tests
        working-directory: DraftRightWindows/DraftRightWindows.PureTests
        run: dotnet test --logger "console;verbosity=normal"

  build:
    needs: unit-tests
    name: Build ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    env:
      RUNTIME: ${{ matrix.runtime }}
      COMMIT_SHA: ${{ github.sha }}
      # Single source of truth for the signing script path — both sign steps
      # below reference this, and both run from working-directory:
      # DraftRightWindows so the one relative literal resolves for each.
      # The secret NAMES (WINDOWS_SIGNING_PFX_*) are owned by this script's
      # header — see DraftRightWindows/installer/sign-file.ps1.
      SIGN_SCRIPT: installer/sign-file.ps1

    defaults:
      run:
        working-directory: DraftRightWindows/DraftRightWindows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET info
        run: dotnet --info

      # Materialize the gitignored GoogleOAuthConfig.cs from the repo secret
      # so the Google sign-in code can compile against the real client_secret.
      # The template (.cs.template) is committed; the secret never enters git.
      # Fails the build clearly if the secret isn't set, instead of silently
      # shipping "REPLACE_ME". String.Replace is used (not here-string
      # interpolation) so the secret bytes can't break C# tokenization.
      - name: Write GoogleOAuthConfig.cs from secret
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS }}
        run: |
          if (-not $env:GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS) {
            Write-Error "GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS repo secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          }
          # Paths are relative to the job's working-directory
          # (DraftRightWindows/DraftRightWindows) set in defaults.
          $src = "Services/GoogleOAuthConfig.cs.template"
          $dst = "Services/GoogleOAuthConfig.cs"
          (Get-Content $src -Raw).Replace("REPLACE_ME", $env:GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS) | Set-Content -Path $dst -Encoding UTF8
          Write-Host "Wrote $dst from template"

      - name: Restore
        run: dotnet restore -r "$env:RUNTIME"

      - name: Publish self-contained single-file
        run: |
          dotnet publish `
            -c Release `
            -r "$env:RUNTIME" `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -o publish

      # Sign the app binary before it is wrapped into the installer, so the
      # installed program is trusted on first launch too. Dormant until a
      # signing cert is configured — see installer/sign-file.ps1 and #154.
      - name: Sign app binary
        shell: pwsh
        working-directory: DraftRightWindows
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: '& $env:SIGN_SCRIPT -Path DraftRightWindows/publish/DraftRightWindows.exe'

      - name: Inspect output and rename for upload
        shell: pwsh
        run: |
          $exe = Get-Item publish\DraftRightWindows.exe
          "Built: $($exe.FullName)"
          "Size:  $([math]::Round($exe.Length/1MB, 1)) MB"
          $shortSha = $env:COMMIT_SHA.Substring(0, 7)
          $name = "DraftRight-Windows-${env:RUNTIME}-$shortSha.exe"
          Copy-Item publish\DraftRightWindows.exe "publish\$name"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_NAME=$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DraftRight-Windows-${{ matrix.runtime }}
          path: DraftRightWindows/DraftRightWindows/publish/${{ env.ARTIFACT_NAME }}
          retention-days: 30

      # ── Installer ─────────────────────────────────────────────────────
      # Wrap the published files into an Inno Setup .exe installer with a
      # Start menu entry, Add/Remove Programs registration, and uninstaller.
      # Inno Setup is preinstalled on windows-latest runners; the choco line
      # below is a safety net in case the image changes.

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not preinstalled, installing via choco..."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe still not found after install attempt"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build installer
        shell: pwsh
        working-directory: DraftRightWindows
        run: |
          # Read the version from the built .exe so the installer carries
          # the same version string as the binary. Strip any "+commit" suffix
          # (.NET adds the source-link InformationalVersion as ProductVersion,
          # e.g. "1.0.0+1f1a6605..."); Inno Setup's VersionInfoVersion only
          # accepts numeric MAJOR.MINOR.BUILD[.REVISION].
          $exe = Get-Item DraftRightWindows\publish\DraftRightWindows.exe
          $rawVersion = $exe.VersionInfo.ProductVersion
          $version = if ([string]::IsNullOrEmpty($rawVersion)) {
            "1.0.0"
          } else {
            ($rawVersion -split '\+')[0]
          }

          # Inno Setup wants the arch as just "x64" or "arm64" (not "win-x64").
          $arch = "$env:RUNTIME" -replace "^win-", ""

          $sourceDir = (Resolve-Path "DraftRightWindows\publish").Path

          Write-Host "Building installer: version=$version arch=$arch"
          Write-Host "  source: $sourceDir"

          & "$env:ISCC" `
            "/DAppVersion=$version" `
            "/DSourceDir=$sourceDir" `
            "/DArch=$arch" `
            installer\draftright.iss

          # Stamp the installer filename with the short SHA so artifacts
          # uploaded across runs are distinguishable.
          $shortSha = $env:COMMIT_SHA.Substring(0, 7)
          $built = Get-Item "installer\Output\DraftRight-Setup-$version-$arch.exe"
          $stamped = "DraftRight-Setup-$version-$arch-$shortSha.exe"
          Move-Item $built.FullName "installer\Output\$stamped"
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_NAME=$stamped"

      # Sign the installer before it is uploaded, so the bytes the update
      # server hashes (sha256, #22) and serves are the signed bytes — the
      # signature and the published hash cannot disagree. Dormant until a
      # signing cert is configured (installer/sign-file.ps1, #154).
      - name: Sign installer
        shell: pwsh
        working-directory: DraftRightWindows
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: '& $env:SIGN_SCRIPT -Path installer/Output/$env:INSTALLER_NAME'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DraftRight-Setup-${{ matrix.runtime }}
          path: DraftRightWindows/installer/Output/${{ env.INSTALLER_NAME }}
          retention-days: 30

      - name: Attach to release (if a release triggered this run)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DraftRightWindows/DraftRightWindows/publish/${{ env.ARTIFACT_NAME }}
            DraftRightWindows/installer/Output/${{ env.INSTALLER_NAME }}

  # ── Auto-deploy installer to update server ────────────────────────────
  # Fires on either a GitHub Release being created OR a `v*` tag being
  # pushed — either path is treated as a deliberate release intent. Routine
  # branch pushes (develop/main) skip this job. Picks the x64 installer —
  # arm64 users can still grab the .exe from the GitHub Release page until
  # we ramp arm64 to the update server.
  #
  # Required repo secrets:
  #   DROPLET_SSH_KEY  — private key for deploy@droplet (dedicated
  #                      ~/.ssh/draftright_deploy keypair, NOT a personal key)
  #   DROPLET_HOST     — IP or hostname of the production droplet
  # No admin credentials needed — DB write is done over ssh+psql with the
  # same key that SCPs the installer.
  publish-to-update-server:
    name: Publish to update server
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for CHANGELOG release notes)
        uses: actions/checkout@v6

      - name: Download x64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: DraftRight-Setup-win-x64
          path: dist

      - name: Resolve version + remote filename
        id: meta
        env:
          GITHUB_REF_NAME_SAFE: ${{ github.ref_name }}
        run: |
          INSTALLER=$(ls dist/*.exe | head -n1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No installer .exe found in dist/"
            exit 1
          fi
          # github.ref_name on a release event is the tag name, e.g. "v2.2.5".
          # Strip leading "v" + reject anything that is not a strict semver
          # so a maliciously named tag cannot inject shell metacharacters.
          TAG="$GITHUB_REF_NAME_SAFE"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Refusing unsafe version string: $VERSION"
            exit 1
          fi
          REMOTE="DraftRight-Setup-Windows-${VERSION}-x64.exe"
          # Artifact SHA-256 — the desktop updater verifies the installer it
          # downloads against this before executing it (issue #22). Computed
          # here, from the exact bytes that get scp'd in the next step, so the
          # hash and the published file cannot disagree.
          SHA256=$(sha256sum "$INSTALLER" | awk '{print $1}')
          {
            echo "installer=$INSTALLER"
            echo "version=$VERSION"
            echo "remote=$REMOTE"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"
          ls -lh "$INSTALLER"
          echo "sha256: $SHA256"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          NEW_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Every release must carry a user-facing note (shown post-update as
          # "What's New"). A missing CHANGELOG section fails the release.
          if ! NOTES=$(bash scripts/changelog-extract.sh "$NEW_VERSION"); then
            echo "::error::No '## $NEW_VERSION' section in CHANGELOG.md — add release notes before tagging a release."
            exit 1
          fi
          {
            echo "notes<<DRNOTES_EOF"
            echo "$NOTES"
            echo "DRNOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release notes for $NEW_VERSION:"; echo "$NOTES"

      - name: SCP installer to droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          INSTALLER_PATH: ${{ steps.meta.outputs.installer }}
          REMOTE_NAME: ${{ steps.meta.outputs.remote }}
        run: |
          umask 077
          printf '%s\n' "$DROPLET_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/known_hosts \
              "$INSTALLER_PATH" \
              "deploy@${DROPLET_HOST}:/tmp/${REMOTE_NAME}"
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/known_hosts \
              "deploy@${DROPLET_HOST}" \
              "sudo mv /tmp/\"${REMOTE_NAME}\" /var/www/draftright/downloads/\"${REMOTE_NAME}\""

      - name: Upsert app_releases.windows row via ssh+psql
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          NEW_VERSION: ${{ steps.meta.outputs.version }}
          REMOTE_NAME: ${{ steps.meta.outputs.remote }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          # Match what scripts/release-publish.sh does locally: write to
          # app_releases via psql over the SSH tunnel rather than the HTTP
          # /admin/releases endpoint. The endpoint enforces role=admin, but
          # the deploy user on the droplet is already trusted (it owns the
          # backend container) so a direct DB upsert is the simpler path.
          # Avoids needing to mint a fresh admin JWT every release.
          #
          # The statement itself comes from scripts/app-release-upsert-sql.sh,
          # shared with release-publish.sh — the two used to carry separate
          # copies and drifted, which is how CI-published Windows releases
          # ended up with an empty sha256 (issue #22).
          # RELEASE_NOTES is passed via env (not inlined as an Actions
          # expression) so its contents can't break the script.
          SQL=$(RELEASE_NOTES="$RELEASE_NOTES" \
            bash scripts/app-release-upsert-sql.sh \
              windows direct "$NEW_VERSION" \
              "https://draftright.info/downloads/$REMOTE_NAME" \
              "$SHA256")
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/known_hosts \
              "deploy@${DROPLET_HOST}" \
              "sudo docker exec -i draftright-postgres-1 psql -U draftright -d draftright -v ON_ERROR_STOP=1" <<<"$SQL"

      - name: Verify /updates/latest reports new version
        env:
          EXPECTED: ${{ steps.meta.outputs.version }}
          EXPECTED_SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          MANIFEST=$(curl -fsS "https://api.draftright.info/updates/latest?platform=windows")
          ACTUAL=$(jq -r '.platforms.windows.version' <<<"$MANIFEST")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::/updates/latest reports $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "✓ /updates/latest reports windows $ACTUAL"

          # Integrity gate (issue #22). The desktop updater treats an empty
          # hash as "publisher didn't provide one" and installs the .exe
          # unverified, so an empty value here is a silent security
          # regression, not a cosmetic one — fail the release instead.
          ACTUAL_SHA=$(jq -r '.platforms.windows.sha256 // ""' <<<"$MANIFEST")
          if [ -z "$ACTUAL_SHA" ]; then
            echo "::error::/updates/latest published an EMPTY windows sha256 — clients would install this installer unverified."
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::sha256 mismatch — manifest says $ACTUAL_SHA, installer hashes to $EXPECTED_SHA"
            exit 1
          fi
          echo "✓ /updates/latest serves matching sha256 $ACTUAL_SHA"

      - name: Verify installer landed on the droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          REMOTE_NAME: ${{ steps.meta.outputs.remote }}
        run: |
          # Verify SERVER-SIDE over SSH, not via public HTTP. The GitHub runner's
          # egress to draftright.info/downloads is unreliable from US runners
          # (edge/geo rules return code=000 even though the file serves fine
          # globally), which false-failed every release despite a good publish.
          # The installer was just scp'd to this exact path, so check it at the
          # source of truth — reusing /tmp/deploy_key from the SCP step above.
          SIZE=$(ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=/tmp/known_hosts \
              "deploy@${DROPLET_HOST}" \
              "stat -c %s /var/www/draftright/downloads/\"${REMOTE_NAME}\" 2>/dev/null || echo 0")
          SIZE=$(printf '%s' "$SIZE" | tr -dc '0-9')
          echo "installer size on droplet: ${SIZE:-0} bytes"
          if [ "${SIZE:-0}" -lt 1000000 ]; then
            echo "::error::/var/www/draftright/downloads/${REMOTE_NAME} missing or too small (${SIZE:-0} bytes)."
            exit 1
          fi
          echo "✓ installer present on droplet — ${SIZE} bytes"

  # ── MSIX bundle for Microsoft Store submission ──────────────────────────
  # Single-project MSIX: WindowsPackageType=MSIX activates AppxPackage targets
  # which produce an .msixbundle for x64+arm64. Submitted to Microsoft Store,
  # which signs the bundle automatically before publishing — no developer
  # cert required. Independent of the unpackaged Inno-installer build above.
  msix:
    name: Build MSIX bundle for Microsoft Store
    # Same gate as `build` — a failing unit test must not yield a Store package.
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      COMMIT_SHA: ${{ github.sha }}

    defaults:
      run:
        working-directory: DraftRightWindows/DraftRightWindows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Same secret-materialization step as the unpackaged build above —
      # the MSIX compilation also needs GoogleOAuthConfig.cs to exist, since
      # GoogleOAuth.cs references GoogleOAuthConfig.ClientSecret.
      - name: Write GoogleOAuthConfig.cs from secret
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS }}
        run: |
          if (-not $env:GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS) {
            Write-Error "GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS repo secret is not set."
            exit 1
          }
          $src = "Services/GoogleOAuthConfig.cs.template"
          $dst = "Services/GoogleOAuthConfig.cs"
          (Get-Content $src -Raw).Replace("REPLACE_ME", $env:GOOGLE_OAUTH_CLIENT_SECRET_WINDOWS) | Set-Content -Path $dst -Encoding UTF8
          Write-Host "Wrote $dst from template"

      # Stamp the MSIX package version from the csproj <Version> so csproj is
      # the single source of truth and the manifest can never drift (it drifted
      # to 2.3.40 while the app was 2.3.49 and Partner Center rejected the
      # upload — #170). Scope the replace to the <Identity> element so it can't
      # touch TargetDeviceFamily Min/MaxVersion. Package version is X.Y.Z.0.
      - name: Stamp MSIX version from csproj
        shell: pwsh
        run: |
          $csproj = Get-Content DraftRightWindows.csproj -Raw
          $m = [regex]::Match($csproj, '<Version>(\d+\.\d+\.\d+)</Version>')
          if (-not $m.Success) { throw "No <Version>X.Y.Z</Version> found in csproj" }
          $pkgVersion = "$($m.Groups[1].Value).0"

          $manifestPath = 'Package.appxmanifest'
          $xml = Get-Content $manifestPath -Raw
          $pattern = '(<Identity\b[^>]*?\bVersion=")[^"]*(")'
          $updated = [regex]::Replace($xml, $pattern, "`${1}$pkgVersion`${2}")
          if ($updated -eq $xml) { throw "Could not find <Identity ... Version> to stamp" }
          Set-Content -Path $manifestPath -Value $updated -Encoding UTF8 -NoNewline
          Write-Host "Stamped MSIX package version = $pkgVersion"

      - name: Restore
        run: msbuild /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build MSIX (x64, StoreUpload)
        shell: pwsh
        run: |
          # Platform=x64 is the WinUI 3 architecture selector for MSIX.
          # RuntimeIdentifier is deliberately omitted: it shifts output to a
          # win-x64/ subfolder but resources.pri is generated at the parent
          # path, causing APPX0702. PackageArchitecture=x64 tells the WinAppSdk
          # recipe target the target arch (fixes WinAppSdkGenerateAppxPackageRecipe).
          msbuild `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsPackageType=MSIX `
            /p:EnableMsixTooling=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Never `
            /p:PackageArchitecture=x64 `
            /p:AppxPackageDir=AppPackages\

      - name: Create .msixupload
        shell: pwsh
        run: |
          # The VS-only _BuildMsixUploadPackage target is not available on CI runners.
          # Build it manually: zip ONLY the .msix into a .msixupload. Partner Center
          # rejects bundles that include .msixsym (symbol files) with "not supported"
          # validation errors, so we omit them — they're optional debug aids, not
          # required for Store submission.
          $msix = Get-ChildItem -Path AppPackages -Recurse -Include *.msix | Select-Object -First 1
          if (-not $msix) {
            Write-Host "AppPackages tree:"
            Get-ChildItem -Path AppPackages -Recurse | Select-Object FullName, Length
            throw "No .msix found in AppPackages"
          }
          $shortSha = $env:COMMIT_SHA.Substring(0, 7)
          $upload = "AppPackages\DraftRight-Store-$shortSha.msixupload"
          Compress-Archive -Path $msix.FullName -DestinationPath $upload -Force
          $sizeMB = [math]::Round((Get-Item $upload).Length / 1MB, 1)
          Write-Host "Created $upload ($sizeMB MB) from $($msix.Name)"
          Add-Content -Path $env:GITHUB_ENV -Value "MSIX_NAME=DraftRight-Store-$shortSha.msixupload"
          Add-Content -Path $env:GITHUB_ENV -Value "MSIX_PATH=DraftRightWindows/DraftRightWindows/AppPackages/DraftRight-Store-$shortSha.msixupload"

      - name: Upload MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: DraftRight-MSIX-Store
          path: ${{ env.MSIX_PATH }}
          retention-days: 30
