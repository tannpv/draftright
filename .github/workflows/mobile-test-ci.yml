name: Mobile tests

# The Flutter app ships 100+ Dart unit/widget tests under DraftRightMobile/test/,
# and the Android keyboard ships JUnit suites under android/app/src/test/ —
# until now no machine ran either (RULE #1: a test suite that no machine
# enforces is dead weight). This gate runs `flutter analyze` + `flutter test`
# on Dart changes and `:app:testDebugUnitTest` on Kotlin changes.
#
# Runs on the self-hosted Contabo runner because GitHub-hosted minutes are
# billing-blocked; Flutter is provisioned per-run by flutter-action (same version
# the Play deploy uses). `--no-fatal-infos` keeps pre-existing lint infos
# (e.g. DropdownButtonFormField value→initialValue deprecations) non-blocking
# while still failing on warnings + errors.

on:
  push:
    branches: [develop, main]
    paths:
      - 'DraftRightMobile/lib/**'
      - 'DraftRightMobile/test/**'
      - 'DraftRightMobile/pubspec.yaml'
      - 'DraftRightMobile/pubspec.lock'
      - 'DraftRightMobile/android/app/src/**'
      - 'DraftRightMobile/android/app/build.gradle.kts'
      - 'DraftRightMobile/android/gradle/**'
      - 'DraftRightMobile/android/gradlew'
      - '.github/workflows/mobile-test-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-test:
    name: flutter analyze + test
    runs-on: [self-hosted, linux, x64, draftright]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DraftRightMobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit + widget tests
        run: flutter test

  # Kotlin keyboard/IME JUnit suites (AutoCorrector, composers, parity vectors…).
  # Scoped to :app — the bare task would fan out to every Flutter plugin
  # subproject and fail on the ones without tests (see DraftRightMobile/CLAUDE.md
  # "Known Patterns"). Same runner as play-deploy, so the Android SDK is present.
  # PERMANENTLY on the Mac runner: the Contabo box killed its runner agent on
  # every attempt at this gradle+Kotlin compile (3 crashes on 2026-09-03, even
  # serialized with capped heap/workers), while the Mac ran it green. The box
  # stays fine for the lighter Dart job above, parity guards, and play-deploy.
  # Different boxes now, so no `needs:` serialization.
  android-unit-tests:
    name: android unit tests
    runs-on: [self-hosted, macos, arm64, draftright-mac]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # AGP needs ANDROID_HOME even for JVM-only unit tests. The Mac's own
      # SDK carries everything incl. the pinned NDK 28.2 (setup-android's
      # fresh-dir NDK auto-install corrupted when tried).
      - name: Use the machine's Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          cache: true
      - name: Resolve dependencies
        working-directory: DraftRightMobile
        run: flutter pub get
      # A build the runner agent lost mid-flight leaves its gradle/kotlin
      # daemons behind; one such zombie pinned the box's CPU and starved two
      # consecutive runs. Report + reap before building. Accepted trade-off:
      # this would also kill a daemon belonging to a concurrently running
      # play-deploy AAB build on the same box (rare — retrigger it if so).
      - name: Reap stale gradle daemons
        run: |
          pgrep -af 'GradleDaemon|KotlinCompileDaemon' || echo "none found"
          pkill -9 -f 'GradleDaemon|KotlinCompileDaemon' || true
      - name: Kotlin unit tests
        working-directory: DraftRightMobile/android
        env:
          # Bounded so gradle can't starve the shared runner box (see `needs`).
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false
          # Per-workspace gradle home: the box runs two runner slots, and the
          # default shared ~/.gradle journal lock wedged permanently when a
          # starved build's daemon died holding it. The workspace persists on a
          # self-hosted runner, so the cache still survives across runs.
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
        run: ./gradlew :app:testDebugUnitTest --max-workers=2
